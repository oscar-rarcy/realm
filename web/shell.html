<!doctype html>
<!-- Realm — browser build shell. `make web` compiles the game to WebAssembly
     and bakes this page into web/index.html. Serve the web/ directory with
     any static file server (python3 -m http.server) — file:// won't work
     because the .wasm and .data fetches need HTTP. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REALM</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; color: #cbb37a; overflow: hidden;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    /* Fill the whole browser window. The canvas is SIZED (100vw/100vh, not
       auto) — SDL's resizable-window handler syncs the drawing buffer to this
       box and the shim's recomputeGrid() re-lays the grid to fit, so the map
       simply gets bigger. A *pinned* size was only needed to dodge the old
       unsized-canvas feedback-shrink; an explicit viewport size is safe. */
    #canvas {
      display: block; width: 100vw; height: 100vh;
      background: #000; outline: none;
    }
    /* Loading line, then unobtrusive; never intercepts clicks on the canvas. */
    #status {
      position: fixed; left: 0; right: 0; bottom: 6px;
      text-align: center; font-size: 12px; opacity: .55;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1440" height="860" tabindex="-1"
          oncontextmenu="event.preventDefault()"></canvas>
  <!-- Invisible keyboard sink — see the keyboard-capture note below. -->
  <input id="kbd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
         aria-hidden="true"
         style="position:fixed; top:0; left:0; width:1px; height:1px;
                opacity:0; border:0; padding:0; z-index:-1;">
  <div id="status">loading…</div>
  <script>
    var statusEl = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (t) { statusEl.textContent = t || ''; },
      onRuntimeInitialized: function () { statusEl.textContent = ''; }
    };
    // Multiplayer relay, picked at runtime (the game reads Module.relayUrl
    // when a lobby opens): a ?relay=wss://… query parameter wins, else a
    // relay.json ({"relay":"wss://…"}) served beside this page, else the
    // compiled-in default (localhost — right only for local dev).
    var qRelay = new URLSearchParams(location.search).get('relay');
    if (qRelay) { Module.relayUrl = qRelay; }
    else {
      fetch('relay.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (c) { if (c && c.relay) Module.relayUrl = c.relay; })
        .catch(function () {});
    }
    // Keys the game needs that the browser normally eats.
    window.addEventListener('keydown', function (e) {
      if (['Tab', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12'].includes(e.key))
        e.preventDefault();
    }, { capture: true });
    // Keyboard capture: keep an invisible text field focused while playing.
    // Vim-style browser extensions (Vimium and friends) and Firefox's
    // find-as-you-type run single-key shortcuts on keys the page "isn't
    // typing with" — 't' opened a new tab instead of training a unit — but
    // all of them pass keys through when the user is typing in a text
    // field. SDL listens on window and key events on the field bubble
    // there, so the game receives everything exactly as before; SDL's
    // keypress handler preventDefaults, so no text piles up in the field.
    // Skipped on touch devices, where a focused field pops the on-screen
    // keyboard.
    var kbd = document.getElementById('kbd');
    if (!window.matchMedia || !window.matchMedia('(pointer: coarse)').matches) {
      var refocus = function () {
        if (document.activeElement !== kbd) kbd.focus({ preventScroll: true });
      };
      kbd.addEventListener('blur', function () { setTimeout(refocus, 0); });
      kbd.addEventListener('input', function () { kbd.value = ''; });
      window.addEventListener('mousedown', function () { setTimeout(refocus, 0); });
      refocus();
    }
  </script>
  {{{ SCRIPT }}}
</body>
</html>
